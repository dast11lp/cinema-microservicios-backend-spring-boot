<svg width="860" viewBox="0 0 860 660" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="860" height="660" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Cabeceras actores -->
  <rect x="30"  y="20" width="120" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="90"  y="42" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1f2937">Frontend</text>

  <rect x="200" y="20" width="120" height="44" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="260" y="42" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#065f46">Nginx</text>

  <rect x="380" y="20" width="120" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="440" y="42" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3730a3">Booking</text>

  <rect x="570" y="20" width="120" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="630" y="42" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3730a3">Catalog</text>

  <rect x="740" y="20" width="90" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="785" y="42" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#92400e">MP</text>

  <!-- líneas de vida -->
  <line x1="90"  y1="64" x2="90"  y2="630" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="260" y1="64" x2="260" y2="630" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="440" y1="64" x2="440" y2="630" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="630" y1="64" x2="630" y2="630" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="785" y1="64" x2="785" y2="630" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- PASO 1: bloquear sillas -->
  <text x="22" y="96" font-size="11" fill="#9ca3af">1</text>
  <line x1="90" y1="96" x2="252" y2="96" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
  <text x="172" y="89" text-anchor="middle" font-size="11" fill="#374151">POST /chairs/block + JWT</text>

  <line x1="260" y1="116" x2="432" y2="116" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
  <text x="346" y="109" text-anchor="middle" font-size="11" fill="#374151">valida JWT → booking</text>

  <!-- respuesta: sillas bloqueadas -->
  <text x="22" y="148" font-size="11" fill="#9ca3af">2</text>
  <line x1="440" y1="148" x2="98" y2="148" stroke="#059669" stroke-width="1" marker-end="url(#arr-teal)"/>
  <text x="270" y="141" text-anchor="middle" font-size="11" fill="#059669">sillas bloqueadas</text>

  <line x1="30" y1="168" x2="830" y2="168" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- PASO 3: crear reserva -->
  <text x="22" y="194" font-size="11" fill="#9ca3af">3</text>
  <line x1="90" y1="194" x2="252" y2="194" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
  <text x="172" y="187" text-anchor="middle" font-size="11" fill="#374151">POST /reservations + JWT</text>

  <line x1="260" y1="214" x2="432" y2="214" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
  <text x="346" y="207" text-anchor="middle" font-size="11" fill="#374151">→ booking-service</text>

  <!-- PASO 4: booking consulta catalog -->
  <text x="22" y="248" font-size="11" fill="#9ca3af">4</text>
  <line x1="440" y1="248" x2="622" y2="248" stroke="#7c3aed" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr-purple)"/>
  <text x="532" y="241" text-anchor="middle" font-size="11" fill="#7c3aed">GET /screenings/{id}</text>

  <line x1="630" y1="268" x2="448" y2="268" stroke="#7c3aed" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr-purple)"/>
  <text x="532" y="281" text-anchor="middle" font-size="11" fill="#7c3aed">precio, sala, fecha</text>

  <!-- reservationId -->
  <line x1="440" y1="298" x2="98" y2="298" stroke="#059669" stroke-width="1" marker-end="url(#arr-teal)"/>
  <text x="270" y="291" text-anchor="middle" font-size="11" fill="#059669">reservationId</text>

  <line x1="30" y1="318" x2="830" y2="318" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- PASO 5: tokenizar y pagar -->
  <text x="22" y="344" font-size="11" fill="#9ca3af">5</text>
  <rect x="50" y="334" width="80" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="90" y="345" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#92400e">MP SDK local</text>

  <text x="172" y="368" text-anchor="middle" font-size="11" fill="#374151">POST /payments</text>
  <text x="172" y="382" text-anchor="middle" font-size="11" fill="#374151">token + reservationId</text>
  <line x1="90" y1="393" x2="252" y2="393" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <line x1="260" y1="413" x2="432" y2="413" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
  <text x="346" y="406" text-anchor="middle" font-size="11" fill="#374151">→ booking-service</text>

  <!-- PASO 6: booking -> mercadopago -->
  <text x="22" y="428" font-size="11" fill="#9ca3af">6</text>
  <line x1="440" y1="428" x2="777" y2="428" stroke="#d97706" stroke-width="1" marker-end="url(#arr-amber)"/>
  <text x="610" y="421" text-anchor="middle" font-size="11" fill="#d97706">procesa pago</text>

  <line x1="785" y1="448" x2="448" y2="448" stroke="#d97706" stroke-width="1" marker-end="url(#arr-amber)"/>
  <text x="610" y="461" text-anchor="middle" font-size="11" fill="#d97706">approved</text>

  <!-- PASO 7: confirma -->
  <text x="22" y="490" font-size="11" fill="#9ca3af">7</text>
  <text x="450" y="486" font-size="11" fill="#374151">confirma reserva · libera sillas definitivo</text>

  <line x1="440" y1="506" x2="98" y2="506" stroke="#059669" stroke-width="1" marker-end="url(#arr-teal)"/>
  <text x="270" y="499" text-anchor="middle" font-size="11" fill="#059669">pago exitoso</text>

  <!-- resultado final -->
  <rect x="200" y="526" width="460" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="430" y="546" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#065f46">modal de confirmación con resumen</text>

  <!-- leyenda -->
  <line x1="30" y1="586" x2="830" y2="586" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="50"  y1="608" x2="80"  y2="608" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
  <text x="88" y="612" font-size="11" fill="#6b7280">HTTP via Nginx</text>
  <line x1="230" y1="608" x2="260" y2="608" stroke="#7c3aed" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr-purple)"/>
  <text x="268" y="612" font-size="11" fill="#6b7280">comunicación interna</text>
  <line x1="480" y1="608" x2="510" y2="608" stroke="#d97706" stroke-width="1" marker-end="url(#arr-amber)"/>
  <text x="518" y="612" font-size="11" fill="#6b7280">MercadoPago API</text>
  <line x1="680" y1="608" x2="710" y2="608" stroke="#059669" stroke-width="1" marker-end="url(#arr-teal)"/>
  <text x="718" y="612" font-size="11" fill="#6b7280">respuesta exitosa</text>
</svg>
